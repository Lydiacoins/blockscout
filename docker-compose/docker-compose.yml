version: '3.9'

volumes:
  backend-dets:

services:
  redis-db:
    extends:
      file: ./services/redis.yml
      service: redis-db

  db-init:
    extends:
      file: ./services/db.yml
      service: db-init

  db:
    depends_on:
      db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/db.yml
      service: db

  backend:
    image: ghcr.io/blockscout/blockscout-arbitrum:latest
    depends_on:
      - db
      - redis-db
    extends:
      file: ./services/backend.yml
      service: backend
    env_file:
      - ./envs/common-blockscout.env
    volumes:
      - ./logs/:/app/logs/
      - backend-dets:/app/dets
    links:
      - db:database
    environment:
        ETHEREUM_JSONRPC_HTTP_URL: https://rpc.lydiacoins.com
        ETHEREUM_JSONRPC_TRACE_URL: https://rpc.lydiacoins.com
        CHAIN_ID: '1989'
        CHAIN_TYPE: arbitrum

  nft_media_handler:
    image: ghcr.io/blockscout/blockscout-arbitrum:latest
    depends_on:
      - backend
    extends:
      file: ./services/nft_media_handler.yml
      service: nft_media_handler

  visualizer:
    extends:
      file: ./services/visualizer.yml
      service: visualizer

  sig-provider:
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider

  frontend:
    depends_on:
      - backend
    extends:
      file: ./services/frontend.yml
      service: frontend

  stats-db-init:
    extends:
      file: ./services/stats.yml
      service: stats-db-init

  stats-db:
    depends_on:
      stats-db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/stats.yml
      service: stats-db

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats

  user-ops-indexer:
    depends_on:
      - db
      - backend
    extends:
      file: ./services/user-ops-indexer.yml
      service: user-ops-indexer

  proxy:
    depends_on:
      - backend
      - frontend
      - stats
    extends:
      file: ./services/nginx.yml
      service: proxy
